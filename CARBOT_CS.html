/* 화면에 보여줄 시즌 버튼 (null이면 데이터에 있는 모든 시즌 표시)
   시즌 1~5만 쓰고 싶으면 ["1","2","3","4","5"] 로 바꾸세요. */
const VISIBLE_SEASONS = null;

/* 파싱 (같은 시즌 내 중복 제거) */
const DATA = {};   // { "1": [name,...], "쿵": [...] }
RAW.split("\n").map(s => s.trim()).filter(Boolean).forEach(line => {
  const m = line.match(/^(.*)\((.+)\)$/);
  if (!m) return;
  const name = m[1].trim(), season = m[2].trim();
  (DATA[season] = DATA[season] || []);
  if (!DATA[season].includes(name)) DATA[season].push(name);
});

/* ===================== 유틸 ===================== */
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function toChosung(str) {
  return [...str].map(ch => {
    const c = ch.charCodeAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) return CHO[Math.floor((c - 0xAC00) / 588)];
    return ch;
  }).join("");
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const norm = s => s.toLowerCase().replace(/[\s.,!?'"~\-]/g, "");

/* 이름 → 음성 인식 가능한 표기 목록 (X→엑스, S→에스, 119→일일구 등) */
function makeAliases(name) {
  const a = norm(name);
  const set = new Set([a]);
  const base = a.replace(/x/g, "엑스").replace(/s/g, "에스");
  set.add(base);
  if (a.includes("119")) {
    set.add(base.replace("119", "일일구"));
    set.add(base.replace("119", "백십구"));
  }
  return [...set];
}

/* ===================== 게임 상태 ===================== */
let entries = [];       // {name, aliases, revealed, el}
let remaining = 0;
let currentSeason = null;
let locked = false;     // 클리어 연출 중

const $board = document.getElementById("board");
const $count = document.getElementById("count");
const $trans = document.getElementById("transcript");
const $status = document.getElementById("status");
const $overlay = document.getElementById("overlay");
const $seasonBtns = document.getElementById("seasonButtons");

/* 시즌 버튼 생성 */
(function buildButtons() {
  let seasons = Object.keys(DATA);
  seasons.sort((a, b) => {
    const na = parseInt(a), nb = parseInt(b);
    if (isNaN(na)) return 1;
    if (isNaN(nb)) return -1;
    return na - nb;
  });
  if (VISIBLE_SEASONS) seasons = seasons.filter(s => VISIBLE_SEASONS.includes(s));
  seasons.forEach(s => {
    const b = document.createElement("button");
    b.className = "season-btn";
    b.textContent = isNaN(parseInt(s)) ? s : "시즌 " + s;
    b.dataset.season = s;
    b.onclick = () => startGame(s);
    $seasonBtns.appendChild(b);
  });
})();

function setCount(n) {
  remaining = n;
  $count.textContent = n;
}

function startGame(season) {
  if (locked) return;
  currentSeason = season;
  document.querySelectorAll(".season-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.season === season));

  const names = shuffle(DATA[season]);
  $board.innerHTML = "";
  entries = names.map(name => {
    const el = document.createElement("div");
    el.className = "card";
    el.textContent = toChosung(name);
    $board.appendChild(el);
    return { name, aliases: makeAliases(name), revealed: false, el };
  });
  setCount(entries.length);
  $status.textContent = "시즌 " + season + " 시작! 카봇 이름을 말해보세요.";
  startRecognition();
}

function resetToInitial() {
  entries = [];
  currentSeason = null;
  locked = false;
  $overlay.style.display = "none";
  document.querySelectorAll(".season-btn").forEach(b => b.classList.remove("active"));
  $board.innerHTML = '<div id="placeholder">위에서 시즌을 선택하세요!</div>';
  setCount(0);
  $status.textContent = "";
}

function reveal(entry) {
  if (entry.revealed) return;
  entry.revealed = true;
  entry.el.textContent = entry.name;
  entry.el.classList.add("revealed");
  setCount(remaining - 1);
  $status.textContent = "✔ 정답: " + entry.name;
  if (remaining <= 0) finishGame();
}

function finishGame() {
  locked = true;
  $overlay.innerHTML = '🎉 클리어! 🎉<small>잠시 후 처음 화면으로 돌아갑니다</small>';
  $overlay.style.display = "flex";
  setTimeout(resetToInitial, 3500);
}

/* ===================== 정답 판정 ===================== */
let pendingTimer = null;
let lastTexts = [];

/* texts: 인식 결과 후보 문자열 배열, isFinal: 발화 확정 여부 */
function processTexts(texts, isFinal) {
  if (locked || !entries.length) return false;
  let hasPending = false;

  texts.forEach(raw => {
    if (locked) return;
    let masked = norm(raw);
    if (!masked) return;

    // 아직 못 맞힌 항목의 표기를 긴 순서로 정렬 (긴 이름 우선 매칭)
    const cand = [];
    entries.forEach(e => {
      if (!e.revealed) e.aliases.forEach(al => cand.push({ al, e }));
    });
    cand.sort((x, y) => y.al.length - x.al.length);

    const matched = new Map(); // entry -> alias
