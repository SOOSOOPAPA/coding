
                        <!DOCTYPE html>

							<style>
								body {
									background-color: white; /* Ensure the iframe has a white background */
								}

								
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, #e0e7ff 0%, #f5e1ff 50%, #ffe4ec 100%);
    background-attachment: fixed;
    color: #1d1d1f;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 70px 20px 40px;
  }

  header { text-align: center; margin-bottom: 70px; }

  .badge {
    display: inline-block;
    font-size: 14px;
    font-weight: 600;
    color: #6b5bd6;
    background: rgba(255, 255, 255, 0.7);
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 18px;
    backdrop-filter: blur(10px);
  }

  h1 {
    font-size: clamp(26px, 4.5vw, 46px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.3;
  }

  .apps {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 60px;
  }

  .app {
    width: 180px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
  }

  .icon {
    width: 160px;
    height: 160px;
    border-radius: 36px; /* 아이폰 앱 아이콘 느낌 */
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 14px 30px rgba(0, 0, 0, 0.22),
      0 4px 8px rgba(0, 0, 0, 0.12),
      inset 0 0 0 1px rgba(255, 255, 255, 0.25);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s;
  }

  /* 유리 같은 광택 */
  .icon::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
    pointer-events: none;
  }

  .icon svg { width: 98px; height: 98px; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.25)); }

  .app:hover .icon {
    transform: translateY(-8px) scale(1.06);
    box-shadow: 0 24px 40px rgba(0,0,0,0.28), 0 6px 12px rgba(0,0,0,0.15),
                inset 0 0 0 1px rgba(255,255,255,0.3);
  }
  .app:active .icon { transform: scale(0.93); }
  .app:focus-visible .icon { outline: 4px solid #6b5bd6; outline-offset: 4px; }

  .frozen   { background: linear-gradient(145deg, #7ee8fa 0%, #4facfe 55%, #3a6df0 100%); }
  .triangle { background: linear-gradient(145deg, #ffd86f 0%, #ff9a44 55%, #fc6076 100%); }
  .hexagon  { background: linear-gradient(145deg, #c3ff8f 0%, #38d39f 55%, #11998e 100%); }

  .label { margin-top: 18px; text-align: center; }
  .label .name { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .label .sub  { font-size: 15px; color: #6e6e73; margin-top: 4px; }

  footer { margin-top: auto; padding-top: 60px; font-size: 14px; color: #8a8a90; }

  @media (max-width: 640px) {
    body { padding-top: 50px; }
    header { margin-bottom: 45px; }
    .apps { gap: 40px; }
  }


							</style>
                        </head>

<body>

<header>
  <div class="badge">🐢 Turtle Graphics Library </div>
  <h1> 함수로 도형 그리기 </h1>
</header>

<main class="apps">

  <!-- 1. 겨울왕국 -->
  <a class="app" target="_blank" rel="noopener noreferrer"
     href="https://studio.code.org/kr/courses/frozen/units/1/lessons/1/levels/10">
    <div class="icon frozen">
      <svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
        <g id="arm">
          <line x1="50" y1="50" x2="50" y2="10"/>
          <polyline points="38,22 50,30 62,22"/>
          <polyline points="41,36 50,42 59,36" stroke-width="5"/>
        </g>
        <use href="#arm" transform="rotate(60 50 50)"/>
        <use href="#arm" transform="rotate(120 50 50)"/>
        <use href="#arm" transform="rotate(180 50 50)"/>
        <use href="#arm" transform="rotate(240 50 50)"/>
        <use href="#arm" transform="rotate(300 50 50)"/>
      </svg>
    </div>
    <div class="label">
      <div class="name">겨울왕국(Frozen)</div>
      <div class="sub">평행사변형</div>
    </div>
  </a>

  <!-- 2. 아티스트 삼각 평행사변형 -->
  <a class="app" target="_blank" rel="noopener noreferrer"
     href="https://studio.code.org/kr/courses/express-2025/units/1/lessons/24/levels/10">
    <div class="icon triangle">
      <svg viewBox="0 0 100 100" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

        <polygon points="50,12 70,48 50,84 30,48" fill="rgba(255,255,255,0.55)"/>
        <line x1="30" y1="48" x2="70" y2="48" stroke-width="3"/>
      </svg>
    </div>
    <div class="label">
      <div class="name">예술가(Artist)</div>
      <div class="sub">삼각 평행사변형</div>
    </div>
  </a>

  <!-- 3. 아티스트 육각 평행사변형 -->
  <a class="app" target="_blank" rel="noopener noreferrer"
     href="https://studio.code.org/kr/courses/express-2025/units/1/lessons/24/levels/11">
    <div class="icon hexagon">
      <svg viewBox="0 0 100 100" stroke="#fff" stroke-width="4" stroke-linejoin="round">

          <polygon points="50,50 50,16 79.4,33 79.4,67" fill="rgba(255,255,255,0.55)"/>
        </g>
        <use href="#rh" transform="rotate(120 50 50)" opacity="0.8"/>
