  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#334155;
    --text:#e2e8f0; --accent:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:linear-gradient(160deg,#0f172a,#1e1b4b);
    color:var(--text); font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    padding-bottom:150px;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(15,23,42,.95);
    backdrop-filter:blur(6px); padding:12px 16px 10px; border-bottom:1px solid var(--panel2);
  }
  .title-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  h1{margin:0; font-size:1.25rem;}
  #resetBtn{
    background:var(--panel2); color:var(--text); border:none; border-radius:8px;
    padding:6px 12px; cursor:pointer; font-size:.85rem;
  }
  #resetBtn:hover{background:#475569;}
  #chosungBar{display:flex; flex-wrap:wrap; gap:10px 12px; padding-top:6px;}
  .cho-btn{
    position:relative; background:var(--panel); color:var(--text);
    border:2px solid var(--panel2); border-radius:10px; padding:8px 0;
    width:52px; font-size:1.2rem; font-weight:700; cursor:pointer; transition:.15s; font-family:inherit;
  }
  .cho-btn:hover:not(:disabled){border-color:var(--accent); transform:translateY(-2px);}
  .cho-btn.active{background:var(--accent); color:#06283d; border-color:var(--accent);}
  .cho-btn:disabled{opacity:.35; cursor:not-allowed;}
  .badge{
    position:absolute; top:-8px; right:-8px; min-width:20px; height:20px; padding:0 5px;
    background:var(--bad); color:#fff; border-radius:10px; font-size:.7rem; font-weight:700;
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,.5);
  }

  main{padding:28px 110px 20px 20px; min-height:50vh; display:flex; align-items:center; justify-content:center;}
  #board{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; max-width:1100px;}
  .guide{text-align:center; color:#94a3b8; font-size:1.15rem; line-height:1.9;}
  .card{
    background:var(--panel); border:2px solid var(--panel2); color:#fff;
    font-size:1.6rem; font-weight:700; letter-spacing:.12em;
    padding:14px 22px; border-radius:14px; cursor:pointer; user-select:none;
    transition:.15s; font-family:inherit;
  }
  .card:hover{border-color:var(--accent); transform:translateY(-3px);}
  .card.revealed{cursor:default; letter-spacing:.02em; animation:pop .45s ease;}
  .card.voice{background:#14532d; border-color:var(--ok); color:#dcfce7;}
  .card.click{background:#78350f; border-color:var(--warn); color:#fef3c7;}
  .card.revealed:hover{transform:none;}
  @keyframes pop{0%{transform:scale(.7);}60%{transform:scale(1.15);}100%{transform:scale(1);}}

  /* 전광판 */
  #scoreboard{
    position:fixed; right:14px; top:50%; transform:translateY(-60%); z-index:15;
    background:#050505; border:3px solid #444; border-radius:10px; padding:8px 10px 10px;
    text-align:center; width:84px; box-shadow:0 0 14px rgba(255,60,30,.25), inset 0 0 10px #000;
  }
  #scoreboard .lbl{font-size:.68rem; color:#aaa; margin-bottom:4px;}
  #scoreboard .num{
    font-family:"Courier New",monospace; font-size:2.3rem; font-weight:900; color:#ff3b1f;
    text-shadow:0 0 8px #ff3b1f, 0 0 16px rgba(255,59,31,.6); line-height:1.1;
  }
  #scoreboard .num.tick{animation:tick .35s;}
  @keyframes tick{0%{transform:scale(1.4); color:#ffd2c9;}100%{transform:scale(1);}}

  /* 하단 바 */
  #bottom{
    position:fixed; left:0; right:0; bottom:0; z-index:20; background:rgba(15,23,42,.97);
    border-top:1px solid var(--panel2); padding:10px 16px 14px;
  }
  #toast{
    position:absolute; left:50%; top:-46px; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--panel2); padding:8px 18px; border-radius:20px;
    font-weight:700; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;
  }
  #toast.show{opacity:1;}
  #toast.ok{color:var(--ok); border-color:var(--ok);}
  #toast.bad{color:var(--bad); border-color:var(--bad);}
  #transcriptRow{display:flex; align-items:center; gap:8px; margin-bottom:10px; min-height:34px;}
  #transcriptRow .tag{font-size:.8rem; color:#94a3b8; flex-shrink:0;}
  #transcript{
    flex:1; font-size:1.2rem; color:#fde68a; min-height:30px; padding:4px 10px;
    background:#0b1220; border-radius:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #controlRow{display:flex; gap:10px; align-items:center;}
  #micBtn{
    display:flex; align-items:center; gap:8px; border:none; border-radius:10px;
    padding:10px 16px; cursor:pointer; background:var(--panel2); color:var(--text);
    font-size:.95rem; font-weight:700; flex-shrink:0;
  }
  #micBtn .dot{width:10px; height:10px; border-radius:50%; background:#64748b;}
  #micBtn.on{background:#7f1d1d;}
  #micBtn.on .dot{background:#ff4d4d; animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.25;}}
  #answerInput{
    flex:1; padding:11px 14px; border-radius:10px; border:2px solid var(--panel2);
    background:#0b1220; color:#fff; font-size:1rem; outline:none; min-width:0;
  }
  #answerInput:focus{border-color:var(--accent);}
  #submitBtn{
    border:none; border-radius:10px; padding:11px 18px; background:var(--accent);
    color:#06283d; font-weight:700; cursor:pointer; flex-shrink:0;
  }

  /* 클리어 오버레이 */
  #overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:50;
    display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px;
  }
  #overlay.show{display:flex;}
  #overlay .big{font-size:2.6rem; font-weight:900; color:#fde047; animation:pop .6s;}
  #overlay .small{color:#cbd5e1;}

  @media (max-width:640px){
    main{padding-right:100px;}
    .card{font-size:1.25rem; padding:10px 14px;}
    .cho-btn{width:46px;}
    #micBtn span.txt{display:none;}
  }

const JONG_NASAL = new Set([4,16,21]);

const answerInput = $('answerInput'), micBtn = $('micBtn'), overlay = $('overlay');

  }

  if (game.remaining === 0) finishGame();

}

  let best = null;

}

      for (let k = s; k < s+len; k++) used[k] = true;
      if (!best.item.revealed) { reveal(best.item, how); count++; }
    }
  }

}

  const c = processText(v, 'typed');
  if (c === 0) showToast('❌ 일치하는 카봇이 없어요', 'bad');

}

function updateMicUI(){
  micBtn.classList.toggle('on', micOn);
  micBtn.querySelector('.txt').textContent = micOn ? '음성인식 ON' : '음성인식 OFF';
}

function startMic(){
  if (!SR) {
    transcriptEl.textContent = '이 브라우저는 음성 인식을 지원하지 않아요. Chrome 또는 Edge를 사용해주세요.';

  }
  micOn = true;
  updateMicUI();
  transcriptEl.textContent = '듣고 있어요... 카봇 이름을 말해보세요!';

  recog = new SR();
  recog.lang = 'ko-KR';
  recog.continuous = true;
  recog.interimResults = true;
  recog.maxAlternatives = 3;

  recog.onresult = e => {
    let interim = '', lastFinal = '';

      const r = e.results[i];
      if (r.isFinal) {

  };
  recog.onend = () => {
    if (micOn) setTimeout(() => { try { recog.start(); } catch (_) {} }, 250);
  };
  try { recog.start(); } catch (_) {}
}

function stopMic(){
  micOn = false;
  updateMicUI();
  clearTimeout(interimTimer);
  if (recog) { try { recog.stop(); } catch (_) {} }
  transcriptEl.textContent = '(음성 인식이 꺼졌어요)';
}

micBtn.addEventListener('click', () => micOn ? stopMic() : startMic());

  return Math.min(1, cost);
}

/* 음절 단위 편집 거리 (발음 유사도 반영) */
function dist(a, b){
  const n = a.length, m = b.length;
  let prev = Array.from({length:m+1}, (_, j) => j);
  for (let i = 1; i <= n; i++) {
    const cur = [i];
    for (let j = 1; j <= m; j++) {
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + syllCost(a[i-1], b[j-1]));
    }
    prev = cur;
  }
  return prev[m];
}

/* 이름 길이에 따른 허용 오차 */
function threshold(len){
  if (len <= 2) return 0.5;
  if (len === 3) return 1.0;
  if (len <= 5) return 1.5;
  return 2.0;
}

/* ================== 게임 상태 ================== */
const $ = id => document.getElementById(id);
const chosungBar = $('chosungBar'), board = $('board'), scoreNum = $('scoreNum');
const transcriptEl = $('transcript'), toastEl = $('toast');
const answerInput = $('answerInput'), micBtn = $('micBtn'), overlay = $('overlay');

let game = null;   // {key, items:[{name,norm,revealed,el}], remaining}
let finishing = false;

const GUIDE_HTML = board.innerHTML;

/* 초성 버튼 생성 */
GROUP_KEYS.forEach(key => {
  const count = GROUPS[key].length;
  const btn = document.createElement('button');
  btn.className = 'cho-btn';
  btn.dataset.key = key;
  btn.disabled = count === 0;
  btn.innerHTML = `${key}<span class="badge">${count}</span>`;
  btn.addEventListener('click', () => startGame(key));
  chosungBar.appendChild(btn);
});

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setScore(n, animate=true){
  scoreNum.textContent = n === null ? '--' : String(n);
  if (animate) {
    scoreNum.classList.remove('tick');
    void scoreNum.offsetWidth;
    scoreNum.classList.add('tick');
  }
}

let micAutoTried = false;
function startGame(key){
  if (finishing || !GROUPS[key].length) return;
  document.querySelectorAll('.cho-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  const names = shuffle(GROUPS[key]);
  board.innerHTML = '';
  game = { key, remaining: names.length, items: [] };
  names.forEach(name => {
    const el = document.createElement('button');
    el.className = 'card';
    el.textContent = toChosung(name);
    const item = { name, norm: norm(name), revealed: false, el };
    el.addEventListener('click', () => reveal(item, 'click'));
    game.items.push(item);
    board.appendChild(el);
  });
  setScore(game.remaining);
  answerInput.focus();
  if (!micAutoTried && !micOn) { micAutoTried = true; startMic(); }
}

function reveal(item, how){
  if (!game || item.revealed || finishing) return;
  item.revealed = true;
  item.el.textContent = item.name;
  item.el.classList.add('revealed', how === 'click' ? 'click' : 'voice');
  game.remaining--;
  setScore(game.remaining);
  if (how !== 'click') showToast('✅ 정답! ' + item.name, 'ok');
  if (game.remaining === 0) finishGame();
}

function finishGame(){
  finishing = true;
  setTimeout(() => {
    overlay.classList.add('show');
    setTimeout(() => {
      overlay.classList.remove('show');
      resetToInitial();
      finishing = false;
    }, 3000);
  }, 600);
}

function resetToInitial(){
  game = null;
  document.querySelectorAll('.cho-btn').forEach(b => b.classList.remove('active'));
  board.innerHTML = GUIDE_HTML;
  setScore(null, false);
}
$('resetBtn').addEventListener('click', () => { if (!finishing) resetToInitial(); });

let toastTimer;
function showToast(msg, type){
  toastEl.textContent = msg;
  toastEl.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.className = '', 1800);
}

/* ================== 정답 판정 ================== */
/* 단위 문자열(unit)에 가장 가까운 카봇 찾기. 허용 범위 밖이면 null */
function findBest(unit){
  let best = null;
  for (const item of game.items) {
    const d = dist(unit, item.norm);
    if (d > threshold(item.norm.length) + 1e-9) continue;
    if (!best || d < best.d - 1e-9 || (Math.abs(d - best.d) < 1e-9 && best.item.revealed && !item.revealed)) {
      best = { item, d };
    }
  }
  return best;
}

/* 텍스트에서 카봇 이름을 찾아 공개. 공개된 개수 반환 */
function processText(text, how='voice'){
  if (!game || finishing) return 0;
  const tokens = text.split(/\s+/).filter(Boolean);
  const n = tokens.length;
  if (!n) return 0;
  const used = Array(n).fill(false);
  let count = 0;
  for (let len = Math.min(n, 4); len >= 1; len--) {
    for (let s = 0; s + len <= n; s++) {
      if (used.slice(s, s+len).some(Boolean)) continue;
      const unit = norm(tokens.slice(s, s+len).join(''));
      if (!unit) continue;
      const best = findBest(unit);
      if (!best) continue;
      for (let k = s; k < s+len; k++) used[k] = true;
      if (!best.item.revealed) { reveal(best.item, how); count++; }
    }
  }
  return count;
}

/* ================== 키보드 입력 ================== */
function submitAnswer(){
  const v = answerInput.value.trim();
  if (!v) return;
  if (!game) { showToast('먼저 초성을 선택하세요', 'bad'); return; }
  const c = processText(v, 'typed');
  if (c === 0) showToast('❌ 일치하는 카봇이 없어요', 'bad');
  answerInput.value = '';
}
$('submitBtn').addEventListener('click', submitAnswer);
answerInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) submitAnswer(); });

/* ================== 음성 인식 ================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, micOn = false, interimTimer = null;

function updateMicUI(){
  micBtn.classList.toggle('on', micOn);
  micBtn.querySelector('.txt').textContent = micOn ? '음성인식 ON' : '음성인식 OFF';
}

function startMic(){
  if (!SR) {
    transcriptEl.textContent = '이 브라우저는 음성 인식을 지원하지 않아요. Chrome 또는 Edge를 사용해주세요.';
    return;
  }
  micOn = true;
  updateMicUI();
  transcriptEl.textContent = '듣고 있어요... 카봇 이름을 말해보세요!';

  recog = new SR();
  recog.lang = 'ko-KR';
  recog.continuous = true;
  recog.interimResults = true;
  recog.maxAlternatives = 3;

  recog.onresult = e => {
    let interim = '', lastFinal = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) {
        lastFinal = r[0].transcript;
        for (let a = 0; a < r.length; a++) processText(r[a].transcript, 'voice');
      } else {
        interim += r[0].transcript;
      }
    }
    transcriptEl.textContent = interim || lastFinal || transcriptEl.textContent;
    clearTimeout(interimTimer);
    if (interim) {
      // 말이 잠깐 멈추면 중간 결과로도 판정
      interimTimer = setTimeout(() => processText(interim, 'voice'), 600);
    }
  };
  recog.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      micOn = false; updateMicUI();
      transcriptEl.textContent = '마이크 권한이 필요해요. 주소창의 마이크 권한을 허용해주세요.';
    }
  };
  recog.onend = () => {
    if (micOn) setTimeout(() => { try { recog.start(); } catch (_) {} }, 250);
  };
  try { recog.start(); } catch (_) {}
}

function stopMic(){
  micOn = false;
  updateMicUI();
  clearTimeout(interimTimer);
  if (recog) { try { recog.stop(); } catch (_) {} }
  transcriptEl.textContent = '(음성 인식이 꺼졌어요)';
}

micBtn.addEventListener('click', () => micOn ? stopMic() : startMic());
