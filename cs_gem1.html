        seasonOrder.forEach(s => seasons[s] = new Set()); // 중복 제거를 위해 Set 사용

        rawData.split('\n').forEach(line => {
            line = line.trim();
            if (!line) return;
            const match = line.match(/^(.+)\((.+)\)$/);
            if (match) {
                const name = match[1].trim();
                const season = match[2].trim();
                if (seasons[season]) {
                    seasons[season].add(name);
                }
            }
        });

        // Set을 Array로 변환
        Object.keys(seasons).forEach(s => {
            seasons[s] = Array.from(seasons[s]);

        const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
        function getChosung(str) {
            let result = "";
            for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i) - 44032;
                if (code > -1 && code < 11172) {
                    result += CHO[Math.floor(code / 588)];
                } else {
                    result += str.charAt(i); // 영문, 숫자는 그대로 유지
                }
            }
            return result;
        }

        // 4. 게임 상태 변수
        let currentCards = [];
        let remainingCount = 0;
        let isGameActive = false;

        // DOM 요소
        const headerEl = document.getElementById('season-buttons');
        const boardEl = document.getElementById('board-container');
        const scoreEl = document.getElementById('score-number');
        const recognizedTextEl = document.getElementById('recognized-text');
        const textInput = document.getElementById('text-input');
        const submitBtn = document.getElementById('submit-btn');
        const micIndicator = document.getElementById('mic-indicator');

        // 5. 상단 시즌 버튼 생성
        function initButtons() {
            headerEl.innerHTML = '';
            seasonOrder.forEach(season => {
                const count = seasons[season].length;
                const btn = document.createElement('button');
                btn.className = 'season-btn';
                btn.innerHTML = `시즌 ${season} <span class="badge">${count}</span>`;
                btn.onclick = () => startGame(season, btn);
                headerEl.appendChild(btn);
            });
        }

        // 6. 게임 시작 (시즌 선택 시)
        function startGame(season, clickedBtn) {
            // 버튼 활성화 표시
            document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
            clickedBtn.classList.add('active');

            // 데이터 셔플
            const list = [...seasons[season]];
            for (let i = list.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [list[i], list[j]] = [list[j], list[i]];
            }

            // 화면 초기화 및 카드 생성
            boardEl.innerHTML = '';
            currentCards = [];
            remainingCount = list.length;
            isGameActive = true;
            updateScore();

            list.forEach(name => {
                const chosung = getChosung(name);
                const card = document.createElement('div');
                card.className = 'card';
                card.textContent = chosung;
                
                const cardObj = {
                    name: name,
                    chosung: chosung,
                    element: card,
                    solved: false
                };

                // 클릭 시 정답 처리
                card.onclick = () => solveCard(cardObj);
                
                boardEl.appendChild(card);
                currentCards.push(cardObj);
            });

            // 음성인식 시작 시도
            startSpeechRecognition();

            cardObj.element.textContent = cardObj.name;

            remainingCount--;
            updateScore();

                isGameActive = false;

                    alert("축하합니다! 모든 카봇을 찾았습니다! 초기 화면으로 돌아갑니다.");
                    resetGame();
                }, 600);
            }
        }

        function updateScore() {
            scoreEl.textContent = remainingCount;
        }

            isGameActive = false;

            remainingCount = 0;
            updateScore();
            recognizedTextEl.textContent = "대기 중...";

        // 발음 변환 (예: X -> 엑스)
        function normalizeText(str) {
            return str.replace(/\s+/g, '')
                      .toUpperCase()
                      .replace(/X/g, '엑스')
                      .replace(/S/g, '에스')
                      .replace(/EX/g, '이엑스')
                      .replace(/119/g, '일일구');
        }

        // 레벤슈타인 거리 계산 (글자 차이 계산)
        function getEditDistance(a, b) {
            if(a.length === 0) return b.length; 
            if(b.length === 0) return a.length; 
            var matrix = [];
            for(var i = 0; i <= b.length; i++){ matrix[i] = [i]; }
            for(var j = 0; j <= a.length; j++){ matrix[0][j] = j; }
            for(var i = 1; i <= b.length; i++){
                for(var j = 1; j <= a.length; j++){
                    if(b.charAt(i-1) == a.charAt(j-1)){
                        matrix[i][j] = matrix[i-1][j-1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i-1][j-1] + 1, Math.min(matrix[i][j-1] + 1, matrix[i-1][j] + 1));
                    }
                }
            }
            return matrix[b.length][a.length];
        }

                }

                const words = inputStr.split(' ');
                words.push(inputStr); // 전체 문장도 비교 대상에 추가

                for (let word of words) {
                    const normWord = normalizeText(word);
                    if (normWord.length < 2) continue; // 너무 짧은 단어 무시

                    const dist = getEditDistance(normWord, cleanTarget);
                    
                    // 이름 길이에 따른 허용 오차 설정
                    let allowedErrors = 0;
                    if (cleanTarget.length >= 3 && cleanTarget.length <= 4) allowedErrors = 1; // 3~4글자는 1글자 틀려도 인정
                    else if (cleanTarget.length >= 5) allowedErrors = 2; // 5글자 이상은 2글자까지 틀려도 인정

                    if (dist <= allowedErrors) {
                        solveCard(cardObj);
                        break;
                    }
                }
            });
        }

        function handleTextInput() {
            const val = textInput.value.trim();
            if (val) {
                recognizedTextEl.textContent = `[키보드] ${val}`;
                checkAnswer(val);
                textInput.value = '';
            }
        }

        submitBtn.onclick = handleTextInput;
        textInput.onkeydown = (e) => {
            if (e.key === 'Enter') handleTextInput();
        };

        // 11. 음성 인식 (Web Speech API)
        let recognition = null;
        let isRecognizing = false;

        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                recognizedTextEl.textContent = "이 브라우저는 음성 인식을 지원하지 않습니다. (크롬 권장)";
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.continuous = true;
            recognition.interimResults = true; // 실시간 글자 표시를 위해 true

            recognition.onstart = () => {
                isRecognizing = true;
                micIndicator.classList.remove('mic-off');
                recognizedTextEl.textContent = "듣고 있습니다... 카봇 이름을 말해보세요!";
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const currentText = finalTranscript || interimTranscript;
                if (currentText.trim() !== "") {
                    recognizedTextEl.textContent = currentText;
                    checkAnswer(currentText);
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                if (event.error === 'not-allowed') {
                    recognizedTextEl.textContent = "마이크 권한이 차단되었습니다. 주소창에서 권한을 허용해주세요.";
                    micIndicator.classList.add('mic-off');
                    isRecognizing = false;
                }
            };

            recognition.onend = () => {

                if (isGameActive && isRecognizing) {
                    try {
                        recognition.start();
                    } catch (e) {}
                } else {
                    micIndicator.classList.add('mic-off');
                }
            };
        }

        function startSpeechRecognition() {
            if (!recognition) setupSpeechRecognition();
            if (recognition && !isRecognizing) {
                try {
                    recognition.start();
                } catch (e) {
                    console.log(e);
                }
            }
        }

        initButtons();
        setupSpeechRecognition();

            recognizedTextEl.textContent = "대기 중...";
        }

        // 9. 유사도 판별 알고리즘 (너그러운 정답 인정)
        // 발음 변환 (예: X -> 엑스)
        function normalizeText(str) {
            return str.replace(/\s+/g, '')
                      .toUpperCase()
                      .replace(/X/g, '엑스')
                      .replace(/S/g, '에스')
                      .replace(/EX/g, '이엑스')
                      .replace(/119/g, '일일구');
        }

        // 레벤슈타인 거리 계산 (글자 차이 계산)
        function getEditDistance(a, b) {
            if(a.length === 0) return b.length; 
            if(b.length === 0) return a.length; 
            var matrix = [];
            for(var i = 0; i <= b.length; i++){ matrix[i] = [i]; }
            for(var j = 0; j <= a.length; j++){ matrix[0][j] = j; }
            for(var i = 1; i <= b.length; i++){
                for(var j = 1; j <= a.length; j++){
                    if(b.charAt(i-1) == a.charAt(j-1)){
                        matrix[i][j] = matrix[i-1][j-1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i-1][j-1] + 1, Math.min(matrix[i][j-1] + 1, matrix[i-1][j] + 1));
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function checkAnswer(inputStr) {
            if (!isGameActive || !inputStr) return;
            
            const cleanInput = normalizeText(inputStr);
            if (cleanInput.length === 0) return;

            currentCards.forEach(cardObj => {
                if (cardObj.solved) return;

                const cleanTarget = normalizeText(cardObj.name);
                
                // 1) 완전 일치하거나 말한 내용 안에 카봇 이름이 포함된 경우
                if (cleanInput.includes(cleanTarget) || inputStr.replace(/\s+/g, '').toUpperCase().includes(cardObj.name)) {
                    solveCard(cardObj);
                    return;
                }

                // 2) 글자수 대비 오차 허용 (유사 발음 인정)
                // 입력된 텍스트를 어절 단위로 쪼개서도 비교하고, 전체로도 비교
                const words = inputStr.split(' ');
                words.push(inputStr); // 전체 문장도 비교 대상에 추가

                for (let word of words) {
                    const normWord = normalizeText(word);
                    if (normWord.length < 2) continue; // 너무 짧은 단어 무시

                    const dist = getEditDistance(normWord, cleanTarget);
                    
                    // 이름 길이에 따른 허용 오차 설정
                    let allowedErrors = 0;
                    if (cleanTarget.length >= 3 && cleanTarget.length <= 4) allowedErrors = 1; // 3~4글자는 1글자 틀려도 인정
                    else if (cleanTarget.length >= 5) allowedErrors = 2; // 5글자 이상은 2글자까지 틀려도 인정

                    if (dist <= allowedErrors) {
                        solveCard(cardObj);
                        break;
                    }
                }
            });
        }

        // 10. 키보드 입력 처리
        function handleTextInput() {
            const val = textInput.value.trim();
            if (val) {
                recognizedTextEl.textContent = `[키보드] ${val}`;
                checkAnswer(val);
                textInput.value = '';
            }
        }

        submitBtn.onclick = handleTextInput;
        textInput.onkeydown = (e) => {
            if (e.key === 'Enter') handleTextInput();
        };

        // 11. 음성 인식 (Web Speech API)
        let recognition = null;
        let isRecognizing = false;

        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                recognizedTextEl.textContent = "이 브라우저는 음성 인식을 지원하지 않습니다. (크롬 권장)";
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.continuous = true;
            recognition.interimResults = true; // 실시간 글자 표시를 위해 true

            recognition.onstart = () => {
                isRecognizing = true;
                micIndicator.classList.remove('mic-off');
                recognizedTextEl.textContent = "듣고 있습니다... 카봇 이름을 말해보세요!";
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const currentText = finalTranscript || interimTranscript;
                if (currentText.trim() !== "") {
                    recognizedTextEl.textContent = currentText;
                    checkAnswer(currentText);
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                if (event.error === 'not-allowed') {
                    recognizedTextEl.textContent = "마이크 권한이 차단되었습니다. 주소창에서 권한을 허용해주세요.";
                    micIndicator.classList.add('mic-off');
                    isRecognizing = false;
                }
            };

            recognition.onend = () => {
                // 게임 중이면 끊기지 않고 계속 다시 시작하도록 설정
                if (isGameActive && isRecognizing) {
                    try {
                        recognition.start();
                    } catch (e) {}
                } else {
                    micIndicator.classList.add('mic-off');
                }
            };
        }

        function startSpeechRecognition() {
            if (!recognition) setupSpeechRecognition();
            if (recognition && !isRecognizing) {
                try {
                    recognition.start();
                } catch (e) {
                    console.log(e);
                }
            }
        }

        // 초기 실행
        initButtons();
        setupSpeechRecognition();
    

							</script>
