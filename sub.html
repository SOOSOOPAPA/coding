  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #fff1eb 0%, #ace0f9 100%);
    color: #333;
    display: flex;
    flex-direction: column;
  }

  /* ---------- 상단 컨트롤 ---------- */
  header {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 18px 16px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
  }

  header h1 {
    font-size: 1.3rem;
    margin: 0 12px 0 0;
  }

  select, input[type="text"] {
    height: 48px;
    padding: 0 16px;
    font-size: 1.1rem;
    border: 2px solid #ffb199;
    border-radius: 14px;
    background: #fff;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }

  select:focus, input[type="text"]:focus {
    border-color: #ff6b6b;
    box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.2);
  }

  input[type="text"] { width: 130px; text-align: center; }

  .shake { animation: shake .4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  #goBtn {
    height: 48px;
    padding: 0 34px;
    font-size: 1.3rem;
    font-weight: 900;
    letter-spacing: 2px;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff9a44, #ff3d6e);
    box-shadow: 0 6px 0 #c92a52, 0 10px 18px rgba(255, 61, 110, 0.4);
    transition: transform .1s, box-shadow .1s, filter .2s;
  }
  #goBtn:hover  { filter: brightness(1.08); }
  #goBtn:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #c92a52, 0 4px 8px rgba(255, 61, 110, 0.4);
  }

  /* ---------- 메인 ---------- */
  main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 36px;
    padding: 24px 16px 40px;
  }

  #stageWrap {
    width: min(640px, 100%);
    min-height: 300px;
    padding: 20px;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 28px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #stage {
    --size: 90px;
    display: grid;
    grid-template-columns: repeat(auto-fill, var(--size));
    justify-content: center;
    gap: 6px;
    width: 100%;
  }

  .slot {
    width: var(--size);
    height: var(--size);
    padding: 0;
    border: none;
    background: transparent;
    font-size: calc(var(--size) * 0.7);
    line-height: 1;
    cursor: pointer;
    border-radius: 16px;
    transition: transform .35s cubic-bezier(.34, 1.56, .64, 1), opacity .25s;

  .slot:hover { transform: scale(1.15) rotate(-5deg); }
  .slot:focus-visible { outline: 3px solid #ff6b6b; }

  /* 사라진 자리는 그대로 두고 보이지만 않게 (재정렬 X) */
  .slot.gone {
    opacity: 0;
    transform: scale(0) rotate(90deg);
    pointer-events: none;
  }

  .slot.pop { animation: pop .4s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes pop {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

    margin-top: 14px;
    min-height: 1.6em;
    font-size: 1.15rem;
    color: #666;
    text-align: center;
  }

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;

  }

    position: absolute;

  }
  .digit .real {
    position: relative;
    color: #ff3030;
    text-shadow: 0 0 8px #ff2020, 0 0 20px #ff0000;
  }
  .digit .real.off { color: transparent; text-shadow: none; }

  #board.bump { animation: bump .25s; }
  @keyframes bump {
    50% { transform: scale(1.08); }
  }

  .btns { display: flex; gap: 22px; }

  .round {
    width: 76px;
    height: 76px;
    border: none;
    border-radius: 50%;
    font-size: 2.6rem;
    font-weight: 900;
    color: #fff;
    cursor: pointer;
    line-height: 1;
    transition: transform .1s, box-shadow .1s, filter .2s;
  }
  .round:active:not(:disabled) { transform: translateY(5px); }
  .round:disabled { filter: grayscale(1) opacity(.5); cursor: not-allowed; }

  #minus {
    background: linear-gradient(135deg, #5b8def, #3b5bdb);
    box-shadow: 0 6px 0 #2b44a8, 0 10px 16px rgba(59, 91, 219, .35);
  }
  #minus:active:not(:disabled) { box-shadow: 0 1px 0 #2b44a8; }

  #plus {
    background: linear-gradient(135deg, #51d88a, #2b9e5b);
    box-shadow: 0 6px 0 #1e7a44, 0 10px 16px rgba(43, 158, 91, .35);
  }
  #plus:active:not(:disabled) { box-shadow: 0 1px 0 #1e7a44; }

<body>

<header>
  <h1>🍎 과일 계산기</h1>
  <select id="fruitSelect" aria-label="과일 선택">
    <option value="apple">🍎 사과</option>
    <option value="banana">🍌 바나나</option>
    <option value="grape">🍇 포도</option>
    <option value="watermelon">🍉 수박</option>
    <option value="strawberry">🍓 딸기</option>
  </select>
  <input type="text" id="numInput" inputmode="numeric" maxlength="3" placeholder="숫자 (0~100)" aria-label="개수 입력">
  <button id="goBtn">GO!</button>
</header>

<main>
  <section id="stageWrap">
    <div id="stage"></div>
    <div id="message">과일과 숫자를 고르고 <b>GO!</b>를 눌러보세요 👆</div>
  </section>

  <aside id="panel">
    <div id="board" aria-live="polite">
      <div class="digit"><span class="ghost">8</span><span class="real off">0</span></div>
      <div class="digit"><span class="ghost">8</span><span class="real off">0</span></div>
      <div class="digit"><span class="ghost">8</span><span class="real">0</span></div>
    </div>
    <div class="btns">
      <button class="round" id="minus" aria-label="하나 빼기" disabled>−</button>
      <button class="round" id="plus"  aria-label="하나 더하기" disabled>+</button>
    </div>
  </aside>
</main>

<script>
  const FRUITS = {
    apple:      { name: '사과',   emoji: '🍎' },
    banana:     { name: '바나나', emoji: '🍌' },
    grape:      { name: '포도',   emoji: '🍇' },
    watermelon: { name: '수박',   emoji: '🍉' },
    strawberry: { name: '딸기',   emoji: '🍓' }
  };
  const MAX = 100;

  const $ = id => document.getElementById(id);
  const stage = $('stage'), message = $('message'), board = $('board');
  const input = $('numInput'), select = $('fruitSelect');
  const minusBtn = $('minus'), plusBtn = $('plus');
  const digitEls = [...document.querySelectorAll('.digit .real')];

  let fruit = null;      // 현재 과일 키
  let slots = [];        // { el, visible } - 자리를 유지하기 위한 배열

  // 숫자만 입력되도록
  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '');
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
  $('goBtn').addEventListener('click', start);
  minusBtn.addEventListener('click', removeLast);
  plusBtn.addEventListener('click', addOne);

  function start() {
    const n = parseInt(input.value, 10);
    if (isNaN(n) || n < 0 || n > MAX) {
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('shake');
      message.textContent = `0부터 ${MAX} 사이의 숫자를 입력해 주세요!`;
      input.focus();
      return;
    }
    fruit = select.value;
    stage.innerHTML = '';
    slots = [];
    for (let i = 0; i < n; i++) createSlot(false);
    updateSize();
    update();
  }

  function createSlot(animate) {
    const el = document.createElement('button');
    el.className = 'slot' + (animate ? ' pop' : '');
    el.textContent = FRUITS[fruit].emoji;
    el.setAttribute('aria-label', FRUITS[fruit].name + ' 하나 없애기');
    const slot = { el, visible: true };
    el.addEventListener('click', () => removeSlot(slot));
    stage.appendChild(el);
    slots.push(slot);
    return slot;
  }

  function updateSize() {
    const t = slots.length;
    const size = t <= 20 ? 90 : t <= 40 ? 76 : t <= 70 ? 62 : 52;
    stage.style.setProperty('--size', size + 'px');
  }

  function count() { return slots.filter(s => s.visible).length; }

  // 클릭한 자리에서 그대로 사라짐 (다른 과일은 움직이지 않음)
  function removeSlot(slot) {
    if (!slot.visible) return;
    slot.visible = false;
    slot.el.classList.remove('pop');
    slot.el.classList.add('gone');
    update();
  }

  // "-" 버튼: 보이는 것 중 마지막 하나 제거
  function removeLast() {
    for (let i = slots.length - 1; i >= 0; i--) {
      if (slots[i].visible) { removeSlot(slots[i]); return; }
    }
  }

  // "+" 버튼: 비어 있는 첫 자리를 채우고, 없으면 끝에 새로 추가
  function addOne() {
    if (!fruit || count() >= MAX) return;
    const empty = slots.find(s => !s.visible);
    if (empty) {
      empty.visible = true;
      empty.el.classList.remove('gone');
    } else {
      createSlot(true);
      updateSize();
    }
    update();
  }

  function update() {
    const c = count();
    const str = String(c).padStart(3, '0');

    // 전광판: 앞자리 0은 꺼진 상태로 표시
    digitEls.forEach((el, i) => {
      el.textContent = str[i];
      const leadingZero = i < 2 && str.slice(0, i + 1).replace(/0/g, '') === '';
      el.classList.toggle('off', leadingZero);
    });
    board.classList.remove('bump');
    void board.offsetWidth;
    board.classList.add('bump');

    minusBtn.disabled = !fruit || c === 0;
    plusBtn.disabled  = !fruit || c >= MAX;

    const f = FRUITS[fruit];
    if (c === 0) message.textContent = `${f.name}이(가) 하나도 없어요! 🎉  + 버튼으로 다시 채워보세요`;
    else         message.textContent = `${f.name} ${c}개 · 과일을 클릭하거나 − 버튼을 눌러보세요`;
  }
</script>
</body>
</html>

    const str = String(c).padStart(3, '0');

    // 전광판: 앞자리 0은 꺼진 상태로 표시
    digitEls.forEach((el, i) => {
      el.textContent = str[i];
      const leadingZero = i < 2 && str.slice(0, i + 1).replace(/0/g, '') === '';
      el.classList.toggle('off', leadingZero);
    });
    board.classList.remove('bump');
    void board.offsetWidth;
    board.classList.add('bump');

    minusBtn.disabled = !fruit || c === 0;
    plusBtn.disabled  = !fruit || c >= MAX;

    const f = FRUITS[fruit];
    if (c === 0) message.textContent = `${f.name}이(가) 하나도 없어요! 🎉  + 버튼으로 다시 채워보세요`;
    else         message.textContent = `${f.name} ${c}개 · 과일을 클릭하거나 − 버튼을 눌러보세요`;
  }


							</script>
                        </body>
                        </html>
